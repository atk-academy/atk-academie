<title>ATK — tests de compo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=MedievalSharp&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0403; --bg2:#1a0707; --red:#ff4136; --red2:#ff7a6e; --red-deep:#9c1a12;
    --text:#f5eceb; --lo:#b79a9a; --faint:#7a5c5c; --line:rgba(255,90,70,.18);
  }
  *{box-sizing:border-box; margin:0;}
  body{ background:var(--bg); color:var(--text); font-family:Oswald,system-ui,sans-serif; }
  .variant{ position:relative; min-height:100vh; overflow:hidden; display:flex; }
  .tag{ position:absolute; top:18px; left:20px; z-index:20; font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); background:rgba(0,0,0,.4); padding:6px 12px; border:1px solid var(--line); border-radius:99px; }
  .bg{ position:absolute; inset:0; z-index:0; background:
      radial-gradient(80% 60% at 50% 40%, #2a0a08 0%, transparent 70%),
      linear-gradient(180deg, var(--bg), var(--bg2)); }
  .grain{ position:absolute; inset:0; z-index:1; opacity:.06; pointer-events:none; background-image:radial-gradient(circle,#fff 1px,transparent 1px); background-size:4px 4px; }
  .cta{ display:inline-flex; align-items:center; gap:9px; font-family:Oswald; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:14px; text-decoration:none; color:var(--text); }
  .over{ font-family:Oswald; font-weight:600; letter-spacing:.42em; text-transform:uppercase; color:var(--red2); font-size:13px; }

  /* ---------- A : Emblème colossal ---------- */
  .A{ align-items:center; justify-content:center; text-align:center; }
  .A .emblem{ position:absolute; z-index:1; width:min(78vh,780px); opacity:.16; filter:grayscale(.2) drop-shadow(0 0 60px rgba(255,65,54,.3)); }
  .A .stack{ position:relative; z-index:3; }
  .A h1{ font-family:Cinzel; font-weight:900; font-size:clamp(5rem,20vw,17rem); line-height:.82; letter-spacing:.02em; background:linear-gradient(180deg,#fff,#e7b9b4 45%,var(--red-deep)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 6px 30px rgba(0,0,0,.7)); }
  .A .over{ margin-top:18px; }
  .A .nav{ margin-top:44px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .A .nav a{ padding:15px 30px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.03); backdrop-filter:blur(6px); transition:.2s; }
  .A .nav a:hover{ border-color:var(--red); background:rgba(255,65,54,.1); }

  /* ---------- B : Titre géant en haut ---------- */
  .B{ flex-direction:column; align-items:center; justify-content:flex-start; padding-top:4vh; }
  .B h1{ position:relative; z-index:3; font-family:Cinzel; font-weight:900; font-size:clamp(6rem,27vw,24rem); line-height:.8; letter-spacing:-.01em; color:var(--text); text-shadow:0 4px 40px rgba(0,0,0,.6); }
  .B .rule{ position:relative; z-index:3; width:min(70%,560px); height:1px; background:linear-gradient(90deg,transparent,var(--red),transparent); margin:6px 0 2px; }
  .B .over{ position:relative; z-index:3; }
  .B .emblem{ position:relative; z-index:2; width:min(42vh,420px); margin-top:-2vh; filter:drop-shadow(0 20px 50px rgba(0,0,0,.6)); }
  .B .nav{ position:relative; z-index:3; display:flex; gap:40px; margin-top:12px; }
  .B .nav a{ flex-direction:column; text-align:center; gap:4px; color:var(--text); }
  .B .nav a .sub{ font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--faint); }
  .B .nav a:hover{ color:var(--red2); }

  /* ---------- C : Split éditorial ---------- */
  .C{ align-items:stretch; }
  .C .left{ position:relative; z-index:3; flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 6vw; border-right:1px solid var(--line); }
  .C .left h1{ font-family:Cinzel; font-weight:900; font-size:clamp(4.5rem,13vw,12rem); line-height:.82; letter-spacing:.02em; }
  .C .left h1 span{ display:block; color:var(--red); }
  .C .left .over{ margin-bottom:22px; }
  .C .left .nav{ margin-top:40px; display:flex; flex-direction:column; gap:14px; }
  .C .left .nav a{ font-size:16px; border-left:2px solid var(--red); padding-left:14px; color:var(--text); }
  .C .left .nav a:hover{ color:var(--red2); border-color:var(--red2); }
  .C .left .nav a .arrow{ margin-left:auto; }
  .C .right{ position:relative; z-index:2; flex:1; display:flex; align-items:center; justify-content:center; }
  .C .right img{ width:min(46vh,460px); filter:drop-shadow(0 20px 60px rgba(0,0,0,.7)); }
  @media(max-width:800px){ .C{ flex-direction:column; } .C .left{ border-right:none; border-bottom:1px solid var(--line); padding:8vh 6vw; } }
</style>

<!-- A -->
<section class="variant A">
  <span class="tag">Compo 1 · Emblème colossal</span>
  <div class="bg"></div><div class="grain"></div>
  <img class="emblem" src="assets/atk-logo.png" alt="">
  <div class="stack">
    <h1>ATK</h1>
    <div class="over">Sea of Thieves</div>
    <div class="nav">
      <a class="cta" href="#">Candidature</a>
      <a class="cta" href="#">Match</a>
    </div>
  </div>
</section>

<!-- B -->
<section class="variant B">
  <span class="tag">Compo 2 · Titre géant en haut</span>
  <div class="bg"></div><div class="grain"></div>
  <h1>ATK</h1>
  <div class="rule"></div>
  <div class="over">Sea of Thieves</div>
  <img class="emblem" src="assets/atk-logo.png" alt="">
  <div class="nav">
    <a class="cta" href="#">Candidature<span class="sub">Recrutement &amp; staff</span></a>
    <a class="cta" href="#">Match<span class="sub">Duels &amp; classement</span></a>
  </div>
</section>

<!-- C -->
<section class="variant C">
  <span class="tag">Compo 3 · Split éditorial</span>
  <div class="bg"></div><div class="grain"></div>
  <div class="left">
    <div class="over">Guilde Sea of Thieves</div>
    <h1>ATK<span>Academy</span></h1>
    <div class="nav">
      <a class="cta" href="#">Candidature <span class="arrow">→</span></a>
      <a class="cta" href="#">Match <span class="arrow">→</span></a>
    </div>
  </div>
  <div class="right"><img src="assets/atk-logo.png" alt="ATK"></div>
</section>
