<title>ATK — test compo 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Pirata+One&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a0403; --bg2:#160606; --red:#ff4136; --red2:#ff7a6e; --red-deep:#9c1a12; --text:#f5eceb; --faint:#7a5c5c; --line:rgba(255,90,70,.2); }
  *{box-sizing:border-box; margin:0;}
  html,body{ height:100%; overflow:hidden; }
  body{ background:var(--bg); color:var(--text); font-family:Oswald,system-ui,sans-serif; }
  .stage{ position:relative; height:100vh; width:100%; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; }
  .tag{ position:absolute; top:18px; left:20px; z-index:20; font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); background:rgba(0,0,0,.4); padding:6px 12px; border:1px solid var(--line); border-radius:99px; }
  .bg{ position:absolute; inset:0; z-index:0; background:radial-gradient(85% 65% at 50% 42%,#340c09 0%,transparent 72%),linear-gradient(180deg,var(--bg),var(--bg2)); }
  .pulse-red{ position:absolute; inset:0; z-index:1; background:radial-gradient(50% 45% at 50% 44%, rgba(255,65,54,.20), transparent 70%); animation:breathe 5s ease-in-out infinite; }
  .grain{ position:absolute; inset:0; z-index:2; opacity:.09; pointer-events:none; background-image:radial-gradient(circle,#fff 1px,transparent 1px); background-size:4px 4px; animation:grainmove 6s steps(6) infinite; }
  .emblem{ position:absolute; z-index:1; width:min(84vh,860px); opacity:.30; filter:drop-shadow(0 0 70px rgba(255,65,54,.35)); animation:emblemspin 90s linear infinite, emblembreathe 7s ease-in-out infinite; }
  .stack{ position:relative; z-index:4; animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .title{ position:relative; display:inline-block; }
  h1{ position:relative; font-family:"Metal Mania","Pirata One",serif; font-weight:400; font-size:clamp(6rem,23vw,20rem); line-height:.9; letter-spacing:.03em;
      background:linear-gradient(180deg,#fff 0%,#f0c9c4 38%,var(--red) 74%,var(--red-deep) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
      filter:drop-shadow(0 4px 18px rgba(0,0,0,.7)); animation:titleglow 4s ease-in-out infinite; }
  /* reflet métallique qui balaie les lettres */
  .title::after{ content:"ATK"; position:absolute; inset:0; font-family:"Metal Mania","Pirata One",serif; font-weight:400; font-size:clamp(6rem,23vw,20rem); line-height:.9; letter-spacing:.03em; text-align:center;
      background:linear-gradient(105deg,transparent 45%,rgba(255,255,255,.9) 50%,transparent 55%); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
      pointer-events:none; animation:sheen 3s ease-in-out infinite; }
  .over{ font-family:Oswald; font-weight:600; letter-spacing:.5em; text-transform:uppercase; color:var(--red2); font-size:clamp(11px,1.4vw,15px); margin-top:20px; text-shadow:0 0 14px rgba(255,65,54,.5); display:flex; justify-content:center; align-items:center; gap:16px; }
  .over::before, .over::after{ content:""; width:34px; height:1px; background:linear-gradient(90deg,transparent,var(--red2)); }
  .over::after{ background:linear-gradient(90deg,var(--red2),transparent); }
  .over .dmd{ color:var(--red); font-size:.8em; }
  .embers{ position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
  .embers i{ position:absolute; bottom:34%; width:4px; height:4px; border-radius:50%; background:var(--red2); box-shadow:0 0 8px 2px rgba(255,65,54,.8); opacity:0; animation:ember 4.5s ease-in infinite; }
  .nav{ margin-top:46px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .nav a{ display:inline-flex; align-items:center; gap:9px; font-family:Oswald; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:14px; text-decoration:none; color:var(--text); padding:15px 32px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.03); backdrop-filter:blur(6px); transition:.22s; }
  .nav a:hover{ border-color:var(--red); background:rgba(255,65,54,.12); transform:translateY(-3px); box-shadow:0 10px 30px -12px rgba(255,65,54,.6); }
  @keyframes breathe{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
  @keyframes grainmove{ 0%{transform:translate(0,0);} 25%{transform:translate(-2px,1px);} 50%{transform:translate(1px,-2px);} 75%{transform:translate(-1px,-1px);} 100%{transform:translate(0,0);} }
  @keyframes emblemspin{ to{ transform:rotate(360deg); } }
  @keyframes emblembreathe{ 0%,100%{opacity:.24;} 50%{opacity:.34;} }
  @keyframes titleglow{ 0%,100%{filter:drop-shadow(0 4px 18px rgba(0,0,0,.7)) drop-shadow(0 0 12px rgba(255,65,54,.15));} 50%{filter:drop-shadow(0 4px 18px rgba(0,0,0,.7)) drop-shadow(0 0 28px rgba(255,65,54,.4));} }
  @keyframes rise{ from{opacity:0; transform:translateY(24px) scale(.96);} to{opacity:1; transform:none;} }
  @keyframes sheen{ 0%{background-position:230% 0;} 18%{background-position:-130% 0;} 18.01%{background-position:230% 0;} 40%{background-position:-130% 0;} 100%{background-position:-130% 0;} }
  @keyframes ember{ 0%{opacity:0; transform:translateY(0) scale(.6);} 15%{opacity:1;} 100%{opacity:0; transform:translateY(-220px) scale(1.1);} }
</style>

<div class="stage">
  <span class="tag">Compo 1 · test</span>
  <div class="bg"></div>
  <div class="pulse-red"></div>
  <img class="emblem" src="assets/atk-logo.png" alt="">
  <div class="grain"></div>
  <div class="embers">
    <i style="left:22%; animation-delay:0s;"></i>
    <i style="left:34%; animation-delay:1.4s;"></i>
    <i style="left:48%; animation-delay:.6s;"></i>
    <i style="left:60%; animation-delay:2.1s;"></i>
    <i style="left:72%; animation-delay:3s;"></i>
    <i style="left:41%; animation-delay:3.6s;"></i>
  </div>
  <div class="stack">
    <div class="title"><h1>ATK</h1></div>
    <div class="over"><span class="dmd">◆</span>Sea of Thieves<span class="dmd">◆</span></div>
    <div class="nav">
      <a href="#">Candidature</a>
      <a href="#">Match</a>
    </div>
  </div>
</div>
