<title>ATK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Pirata+One&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#050303; --bg-2:#170606;
    --blob-a:#4a0d0d; --blob-b:#6b0f0f; --blob-c:#250505;
    --surface:rgba(255,255,255,.05); --surface-strong:rgba(255,255,255,.09);
    --border:rgba(255,90,70,.14); --border-strong:rgba(255,90,70,.24);
    --text-hi:#f5eceb; --text-lo:#a58787; --text-faint:#6b4f4f;
    --accent:#ff4136; --accent-2:#ff7a6e;
    --shadow:0 20px 60px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; }
  body{
    color:var(--text-hi); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(85% 65% at 50% 42%, #340c09 0%, transparent 72%), linear-gradient(180deg, var(--bg-1), var(--bg-2)); min-height:100vh; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center;
  }

  /* vignette rouge de fond (profondeur + lisibilité du texte) */
  .video-tint{ position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(60% 55% at 50% 42%, rgba(120,12,12,.20), transparent 70%),
      linear-gradient(180deg, rgba(5,3,3,.28), rgba(5,3,3,.48));
  }

  /* --- Effet rouge qui bouge par-dessus la vidéo --- */
  .liquid-bg{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; filter:blur(55px); mix-blend-mode:screen; }
  .liquid-bg span{ position:absolute; width:55vmax; height:55vmax; border-radius:50%; opacity:.5; }
  .liquid-bg span:nth-child(1){ top:-15%; left:-15%; background:#7a1010; animation:blob1 14s ease-in-out infinite; }
  .liquid-bg span:nth-child(2){ top:10%; right:-20%; background:#a01414; animation:blob2 19s ease-in-out infinite; }
  .liquid-bg span:nth-child(3){ bottom:-20%; left:20%; background:#5b0d0d; animation:blob3 23s ease-in-out infinite; }
  @keyframes blob1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(20%,15%) scale(1.2);} }
  @keyframes blob2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-20%,10%) scale(1.15);} }
  @keyframes blob3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(15%,-20%) scale(1.1);} }

  .hub{ position:relative; z-index:1; text-align:center; padding:40px 20px; }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

  .hero-emblem{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:min(80vh,760px); max-width:118vw; z-index:0; opacity:.28; pointer-events:none; filter:drop-shadow(0 0 70px rgba(255,65,54,.32)); animation:emblemSpin 90s linear infinite, emblemBreathe 7s ease-in-out infinite; }
  @keyframes emblemSpin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
  @keyframes emblemBreathe{ 0%,100%{opacity:.22;} 50%{opacity:.33;} }

  .title{ position:relative; display:inline-block; opacity:0; animation:fadeUp .9s ease .3s forwards; }
  h1{ position:relative; margin:0; font-family:"Metal Mania","Pirata One",serif; font-weight:400; font-size:clamp(4.5rem,16vw,13rem); line-height:.9; letter-spacing:.03em;
      background:linear-gradient(180deg,#fff 0%,#f0c9c4 38%,var(--accent) 74%,#9c1a12 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
      filter:drop-shadow(0 4px 18px rgba(0,0,0,.7)); animation:titleGlow 4s ease-in-out infinite; }
  .title::after{ content:"ATK"; position:absolute; inset:0; text-align:center; font-family:"Metal Mania","Pirata One",serif; font-weight:400; font-size:clamp(4.5rem,16vw,13rem); line-height:.9; letter-spacing:.03em;
      background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.35) 46%,rgba(255,255,255,.8) 50%,rgba(255,255,255,.35) 54%,transparent 62%); background-size:300% 100%; background-repeat:no-repeat; -webkit-background-clip:text; background-clip:text; color:transparent;
      pointer-events:none; animation:sheen 3.2s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes titleGlow{ 0%,100%{filter:drop-shadow(0 4px 18px rgba(0,0,0,.7)) drop-shadow(0 0 12px rgba(255,65,54,.15));} 50%{filter:drop-shadow(0 4px 18px rgba(0,0,0,.7)) drop-shadow(0 0 28px rgba(255,65,54,.4));} }
  @keyframes sheen{ 0%{background-position:220% 0;} 26%{background-position:-120% 0;} 26.001%{background-position:220% 0;} 52%{background-position:-120% 0;} 100%{background-position:-120% 0;} }

  .over{ font-family:Oswald,system-ui,sans-serif; font-weight:600; letter-spacing:.5em; text-transform:uppercase; color:var(--accent-2); font-size:clamp(12px,1.4vw,15px); margin:20px 0 44px; text-shadow:0 0 14px rgba(255,65,54,.5); display:flex; justify-content:center; align-items:center; gap:16px; opacity:0; animation:fadeUp .8s ease .55s forwards; }
  .over::before,.over::after{ content:""; width:34px; height:1px; }
  .over::before{ background:linear-gradient(90deg,transparent,var(--accent-2)); }
  .over::after{ background:linear-gradient(90deg,var(--accent-2),transparent); }
  .over .dmd{ color:var(--accent); font-size:.8em; }

  .embers{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .embers i{ position:absolute; bottom:40%; width:4px; height:4px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 8px 2px rgba(255,65,54,.8); opacity:0; animation:ember 4.5s ease-in infinite; }
  @keyframes ember{ 0%{opacity:0; transform:translateY(0) scale(.6);} 15%{opacity:1;} 100%{opacity:0; transform:translateY(-220px) scale(1.1);} }

  .nav-dots{ display:flex; gap:28px; justify-content:center; flex-wrap:wrap; opacity:0; animation:fadeUp .8s ease .95s forwards; }
  .nav-dot{
    display:flex; flex-direction:column; align-items:center; gap:14px; text-decoration:none; color:var(--text-hi);
    width:150px;
  }
  .nav-dot .circle{
    width:104px; height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--surface); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border); box-shadow:var(--shadow);
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .nav-dot .circle svg{ width:40px; height:40px; color:var(--accent-2); }
  .nav-dot:hover .circle{ transform:translateY(-6px) scale(1.05); border-color:var(--accent); box-shadow:var(--shadow), 0 0 40px -10px var(--accent); }
  .nav-dot .label{ font-size:15px; font-weight:800; text-shadow:0 1px 6px rgba(0,0,0,.7); }
  .nav-dot .sub{ font-size:12px; color:var(--text-lo); font-weight:700; text-shadow:0 1px 6px rgba(0,0,0,.75); }
</style>

<div class="video-tint" aria-hidden="true"></div>
<div class="liquid-bg" aria-hidden="true"><span></span><span></span><span></span></div>



<img class="hero-emblem" src="assets/atk-logo.png" alt="" aria-hidden="true">
<div class="embers" aria-hidden="true"><i style="left:22%;animation-delay:0s"></i><i style="left:34%;animation-delay:1.4s"></i><i style="left:48%;animation-delay:.6s"></i><i style="left:60%;animation-delay:2.1s"></i><i style="left:72%;animation-delay:3s"></i><i style="left:41%;animation-delay:3.6s"></i></div>
<div class="hub">
  <div class="title"><h1>ATK</h1></div>
  <div class="over"><span class="dmd">◆</span>Sea of Thieves<span class="dmd">◆</span></div>

  <div class="nav-dots">
    <a class="nav-dot" href="recrutement.html">
      <div class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="7" y1="14" x2="13" y2="14"/><line x1="7" y1="17" x2="11" y2="17"/></svg></div>
      <div class="label">Candidature</div>
      <div class="sub">Recrutement &amp; staff</div>
    </a>
    <a class="nav-dot" href="atk-duel.html">
      <div class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l12 16M18 4L6 20"/><circle cx="6" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="6" cy="20" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="20" r="1.6" fill="currentColor" stroke="none"/></svg></div>
      <div class="label">Match</div>
      <div class="sub">Duels &amp; classement</div>
    </a>
  </div>
</div>
